<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reminder Kozhi 🐔</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="kozhibox">

            <div class="kozhi">
                🐔
            </div>

            <h1>Reminder Kozhi</h1>

            <p class="subtitle">
                You didn't ask for me.<br>
                I'm here anyway.
            </p>

            <div class="message-box">
                <p id="message">
                    "Hey..."
                </p>
            </div>

            <button id="okayBtn">
                Okay 😐
            </button>

            <p class="status">
                The kozhi will bother you again.
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
