<<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reminder Kozhi 🐔</title>

    <link rel="stylesheet" href="style.css">
</head>

<!-- Notification popup -->

<body>

    <main class="container">

        <div class="kozhibox">

            <!-- Chicken -->
            <div class="kozhi">
                🐔
            </div>

            <!-- App title -->
            <h1>Reminder Kozhi</h1>

            <p class="subtitle">
                You didn't ask for me.<br>
                I'm here anyway.
            </p>


            <!-- Chat area -->
            <div class="chat-box" id="chatBox">

                <!-- Kozhi's first message -->
                <div class="message kozhi-message">
                    Chaaya kudicho? ☕
                </div>

            </div>


            <!-- Typing indicator -->
            <div class="typing" id="typing">
                Kozhi is typing...
            </div>


            <!-- Input area -->
            <div class="input-area">

                <input
                    type="text"
                    id="userInput"
                    placeholder="Type something..."
                    autocomplete="off"
                >

                <button id="sendBtn">➤</button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>
    <!-- Notification popup -->

<div class="notification" id="notification">

    <div class="notification-chicken">
        🐔
    </div>

    <div class="notification-text">
        <strong>Reminder Kozhi</strong>
        <p id="notificationMessage">
            OOPS!! ONNUM PARANJITT KARYAMILLA 😭
        </p>
    </div>

</div>

</body>

</html>
